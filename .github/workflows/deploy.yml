name: Deploy to GitHub Pages

# Builds the static site and publishes it to GitHub Pages on every push to the
# default branch. No backend — the app is fully static and runs in the browser.

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for the same ref.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        # Project Pages are served from /<repo>/, so set Vite's base path to the
        # repository name. For a user/org page (<user>.github.io) set VITE_BASE=/.
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Add .nojekyll and SPA 404 fallback
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
